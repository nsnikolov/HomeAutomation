services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: homeautomation
      MYSQL_USER: home_migrator
      MYSQL_PASSWORD: ${MYSQL_MIGRATOR_PASSWORD:?Set MYSQL_MIGRATOR_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      HOME_RUNTIME_PASSWORD: ${MYSQL_RUNTIME_PASSWORD:?Set MYSQL_RUNTIME_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/database/01-runtime-user.sh:/docker-entrypoint-initdb.d/01-runtime-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP --host=127.0.0.1 --user=\"$${MYSQL_USER}\" --execute='SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 4s
      retries: 20

  migrate:
    image: homeautomation:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["--migrate", "--bootstrap-user"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      Database__Host: db
      Database__Port: "3306"
      Database__Name: homeautomation
      Database__User: home_migrator
      Database__Password: ${MYSQL_MIGRATOR_PASSWORD:?Set MYSQL_MIGRATOR_PASSWORD in .env}
      Bootstrap__Email: ${BOOTSTRAP_EMAIL:?Set BOOTSTRAP_EMAIL in .env}
      Bootstrap__Password: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD in .env}
    restart: "no"

  app:
    image: homeautomation:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__Host: db
      Database__Port: "3306"
      Database__Name: homeautomation
      Database__User: home_runtime
      Database__Password: ${MYSQL_RUNTIME_PASSWORD:?Set MYSQL_RUNTIME_PASSWORD in .env}
      Simulator__Enabled: ${SIMULATOR_ENABLED:-true}
      Simulator__PollSeconds: ${SIMULATOR_POLL_SECONDS:-10}
      Simulator__FreshnessSeconds: ${SIMULATOR_FRESHNESS_SECONDS:-45}
      Simulator__Scenario: ${SIMULATOR_SCENARIO:-Demonstration}
      DataProtection__KeyDirectory: /app/keys
    volumes:
      - application-keys:/app/keys
    restart: unless-stopped

volumes:
  mysql-data:
  application-keys:
